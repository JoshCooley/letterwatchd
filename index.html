<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letterwatchd</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="bar">
      <h1 class="logo"><span class="mark"><i>👁</i><i>👁</i><i>👁</i></span>Letterwatchd</h1>
      <nav class="toolbar">
        <button id="btn-lists">Lists</button>
        <button id="btn-import">Import</button>
        <button id="btn-export">Export</button>
        <button id="btn-reset">Reset</button>
      </nav>
    </div>
  </header>

  <main>
    <div id="card">Loading...</div>
    <div class="controls">
      <button id="btn-back">Back</button>
      <button id="btn-skip" class="skip">Skip</button>
      <button id="btn-watched" class="watched">Mark Watched</button>
    </div>
    <section id="lists" hidden></section>
  </main>

  <input id="import-input" type="file" accept=".csv,.zip" hidden>

  <footer>
    <a href="https://www.themoviedb.org/" target="_blank" rel="noopener"><img src="./tmdb-logo.svg" alt="TMDB" style="height:1em;vertical-align:middle"></a>
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
